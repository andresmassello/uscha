<!doctype html>
<!--
  Render source for docs/paper/fig2-spec-hierarchy.png (the paper's Figure 2).

  Until 2.2.0 the light-theme source of this figure lived nowhere in the repo: the
  slide it comes from is dark-themed, and CHANGELOG-1.50.1 recorded the gap ("the
  repository documents no command to regenerate it"). This file closes it. The <svg>
  below is the byte-identical markup of the "specification at a glance" slide in
  docs/uscha-claude-code-doc-EN.html -- edit the SLIDE, then paste it here -- and the
  only thing this wrapper adds is a light rebinding of the CSS variables it reads.

  Regenerate (headless Edge at 2x + PIL autocrop, per CLAUDE.md). One shot:

    msedge --headless=new --disable-gpu --force-device-scale-factor=2
           --window-size=1200,1000 --virtual-time-budget=9000
           --screenshot=raw.png file:///ABS/PATH/fig2-spec-hierarchy.html

  then crop, limiting the search to the first 1600 device rows so a horizontal
  scrollbar can never enter the box, and adding a 10px white margin:

    from PIL import Image, ImageChops
    im  = Image.open("raw.png").convert("RGB")
    top = im.crop((0, 0, im.size[0], 1600))
    bb  = ImageChops.difference(
              top, Image.new("RGB", top.size, (255, 255, 255))
          ).convert("L").getbbox()
    im.crop((bb[0] - 10, bb[1] - 10, bb[2] + 10, min(1600, bb[3] + 10))) \
      .save("fig2-spec-hierarchy.png")

  Verified reproducible: re-running the two steps above over an unchanged source
  yields the committed PNG pixel for pixel. The fonts come from Google Fonts, so
  the render needs network access.
-->
