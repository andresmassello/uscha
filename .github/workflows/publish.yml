name: publish

# Publishes @andresmassello/uscha to npm via TRUSTED PUBLISHING (OIDC) -- no npm token
# exists anywhere: not in this repo's secrets, not on the release machine. GitHub mints a
# short-lived OIDC token for this exact workflow in this exact repo, and npm verifies it
# against the trusted-publisher configuration on npmjs.com. A credential that does not
# exist cannot leak, be rotated late, or be stolen from a compromised laptop.
#
# The human act does not disappear -- it MOVES. Before: someone typed `npm publish`.
# Now: someone creates and pushes the tag, which is already the release ritual. Everything
# after the tag is measured, and nothing publishes until every gate below is green.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # re-run against a TAG ref if a publish fails transiently;
                       # dispatched against a branch, the version guard below fails closed.

# id-token: write is what lets GitHub mint the OIDC token. contents: read is all the rest
# of the job needs. No secrets are referenced anywhere in this file -- by design.
permissions:
  contents: read
  id-token: write
  actions: read      # to read the smoke run recorded for this exact SHA (see below)

jobs:
  publish:
    runs-on: ubuntu-latest
    # Poll (up to 40 min for the matrix to finish) plus, in the worst case, the fallback
    # suite (~30 min on one cell). 20 minutes could not fit either.
    timeout-minutes: 80
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness -- the same reason smoke.yml gives:
      # AC-DF-01 asks whether the root ledger was re-recorded in or after the last engine
      # change, and on a depth-1 checkout `git log -1 -- <file>` returns HEAD for every
      # path, so the criterion would pass without measuring anything. The fallback suite
      # runs here, so it needs the same history the matrix has.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # coverage.py is a CAPTURE-time dependency of golden-coverage (ADR-006), never a
      # runtime one. The fallback suite below is the ONLY measurement backing a publish
      # when no matrix run exists, so it must not be weaker than the matrix: without this,
      # AC-GM-08 reports UNMEASURED here while it is measured there.
      - name: Install coverage.py (so AC-GM-08 is measured on the fallback path too)
        shell: bash
        run: python -m pip install --quiet coverage

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships npm 11.x, but "ships with"
      # is an assumption about a runner image; this MEASURES it and upgrades if short.
      - name: Ensure an npm that can publish via OIDC
        run: |
          set -e
          npm install -g npm@latest
          NPMV="$(npm --version)"; MIN="11.5.1"
          echo "npm ${NPMV} (minimum for trusted publishing: ${MIN})"
          test "$(printf '%s\n%s\n' "$MIN" "$NPMV" | sort -V | head -1)" = "$MIN" || {
            echo "npm ${NPMV} cannot publish via OIDC."; exit 1; }

      # FAIL-CLOSED: the tag IS the release declaration. If the tag and package.json
      # disagree, we cannot know which one is the truth -- so we publish neither.
      # A workflow_dispatch against a branch lands here too (ref_name won't parse as
      # v<version>) and is rejected for the same reason: no declared version, no publish.
      - name: The tag must equal the declared version
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=${TAG}  package.json=${PKG}"
          test "${TAG}" = "v${PKG}" || {
            echo "REFUSING TO PUBLISH: tag '${TAG}' does not declare version '${PKG}'."
            echo "Either the tag is wrong or the bump is incomplete. Fix, then re-tag."
            exit 1
          }

      # The full 6-cell matrix runs on every push to main. Publishing is irreversible (npm
      # unpublish is a 72h courtesy, not an undo), so the bytes about to ship must be green
      # -- and "green" has to be a MEASURED fact about THESE bytes, never a belief. Same SHA
      # = same bytes, so a completed, successful `smoke` run recorded by GitHub for exactly
      # this commit IS that measurement (a fact in GitHub's ledger, not a narration). When
      # such a run exists, it is cited as the receipt and the suite is not repeated here
      # (~30 min saved per release, decided 2026-08-18).
      #
      # Three outcomes, and only three (audit 1.94.1 -- the single-sample version of this
      # step read "still running" as "no run" and silently downgraded to the one-cell
      # fallback, and read "failed" the same way, which would have published over a RED
      # measurement):
      #   still running -> WAIT, up to 40 minutes. The tag is normally pushed with the commit,
      #                    so the matrix is usually still in flight when this job starts.
      #   completed, not success -> FAIL. These exact bytes are measured red; re-running
      #                    the suite here cannot make them green, it can only find a
      #                    friendlier cell.
      #   no run at all -> the fallback suite runs here, exactly as it always did. It is
      #                    ONE cell (ubuntu-latest, py3.13), weaker than the 6-cell matrix,
      #                    and the receipt below says so rather than implying parity.
      #
      # Two honest limits, stated rather than papered over:
      #   * A `gh api` ERROR and a genuinely empty listing look the same from here (both give
      #     no line), and downgrading a red matrix to the one-cell fallback because the API
      #     hiccuped would be the same false green. So an API error is retried, never read as
      #     an answer, and "no run" needs TWO consecutive empty samples a minute apart.
      #   * A fully queued 6-cell matrix can outlast the 40-minute window. That is ACCEPTED:
      #     the job fails closed with the reason named, and the tag can be re-pushed or this
      #     workflow re-run once the matrix finishes. Waiting forever is not a safer default.
      - name: The smoke run for THIS SHA must be green (poll, then fail closed)
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          API="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50"
          SEL='[.workflow_runs[] | select(.name=="smoke")] | sort_by(.run_number) | last | [.status, (.conclusion // "none"), (.html_url // "")] | @tsv'
          EMPTY=0
          for i in $(seq 1 40); do
            RC=0
            LINE="$(gh api "${API}" --jq "${SEL}" 2>/dev/null)" || RC=$?
            if [ "${RC}" -ne 0 ]; then
              echo "gh api failed (${i}/40) -- an API error is not an answer; retrying in 60s"
              sleep 60
              continue
            fi
            STATUS="$(printf '%s' "${LINE}" | cut -f1)"
            CONCL="$(printf '%s' "${LINE}" | cut -f2)"
            URL="$(printf '%s' "${LINE}" | cut -f3)"
            if [ -z "${STATUS}" ]; then
              EMPTY=$((EMPTY + 1))
              if [ "${EMPTY}" -ge 2 ]; then
                echo "no smoke run recorded for ${GITHUB_SHA} (two consecutive empty samples) -- the suite runs here (fail-closed)."
                echo "reuse=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "no smoke run listed for ${GITHUB_SHA} (${i}/40) -- confirming in 60s before falling back"
              sleep 60
              continue
            fi
            EMPTY=0
            if [ "${STATUS}" != "completed" ]; then
              echo "smoke for ${GITHUB_SHA} is ${STATUS} (${i}/40) -- waiting 60s"
              sleep 60
              continue
            fi
            if [ "${CONCL}" = "success" ]; then
              echo "smoke already green for ${GITHUB_SHA}: ${URL}"
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "url=${URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "REFUSING TO PUBLISH: the smoke run for ${GITHUB_SHA} completed '${CONCL}' (${URL})."
            echo "These exact bytes are measured RED. Running the suite here would not fix that."
            echo "Fix the commit, then re-tag."
            exit 1
          done
          echo "REFUSING TO PUBLISH: 40 minutes of polling and the smoke run for ${GITHUB_SHA} never reported a completed status."
          echo "Re-run this workflow once the matrix finishes; publishing on an unfinished measurement is a belief."
          exit 1

      - name: Smoke suite (only when no run exists for these exact bytes)
        if: steps.prior.outputs.reuse != 'true'
        run: bash uscha-kit/tests/smoke-engine.sh

      - name: Receipt of the measurement this publish relies on
        if: steps.prior.outputs.reuse == 'true'
        run: echo "publishing on the strength of ${{ steps.prior.outputs.url }} (same SHA, 6/6 cells)"

      - name: Receipt of the FALLBACK measurement (weaker than the matrix, said out loud)
        if: steps.prior.outputs.reuse != 'true'
        run: |
          echo "publishing on the strength of the fallback suite run in this job for ${GITHUB_SHA}"
          echo "measured here: ubuntu-latest + python 3.13, ONE cell -- NOT the 6-cell matrix (no macOS, no Windows, no py3.8)"

      # What actually leaves the machine. The suite's packaging tests assert the tarball's
      # shape; this prints its real contents so the run log is the receipt of what shipped.
      - name: Show the tarball contents
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN. No secrets. npm reads the OIDC token from the Actions runtime
      # and verifies it against the trusted publisher configured on npmjs.com. Provenance
      # attestation (which commit produced these bytes) is generated automatically.
      - name: Publish to npm (OIDC, tokenless)
        run: npm publish --access public
