name: smoke

# Cross-platform validation. The audit that motivated this (docs/CROSS-PLATFORM.md) was
# STATIC -- nobody had run the suite on a real Linux or macOS box. Per the kit's own
# doctrine, "cross-platform" is a claim until it is MEASURED on all three OSes. This is
# that measurement. A red cell here is a real finding, not a flake.

# Was MANUAL-ONLY for a day (2026-07-25): the account ran out of Actions minutes and every push
# produced a run that died in 6s with "recent account payments have failed" -- six red cells that
# measured NOTHING, which is worse than no signal because a red grid reads like a real failure.
# The repo is PUBLIC as of 2026-07-26, so standard runners are free again and the matrix is back
# on every push. macOS stops being UNMEASURED the moment this grid goes green (docs/CROSS-PLATFORM.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo. It also runs on pull_request,
# i.e. on arbitrary code from forks -- it must therefore NEVER see a publishing secret.
permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false   # one OS red must not hide the others -- we want the full grid
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.13"]   # the declared floor and a current release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Node is only needed by the npm-router tests (T74/T75); they degrade to a skip
      # if a compiler/shim is unavailable, so this is belt-and-suspenders, not required.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Report the interpreter the suite will use
        shell: bash
        run: |
          python --version
          python3 --version || echo "no python3 on PATH (Windows) -- the suite probes for it"

      # shell: bash forces Git-Bash on Windows and the native shell on Linux/macOS, so the
      # ONE suite runs on all three. The engine is Python; only the harness is bash.
      - name: Run the smoke suite
        shell: bash
        run: bash uscha-kit/tests/smoke-engine.sh

      # The smoke exercises the installer with synthetic fixtures; this runs the REAL
      # installer end-to-end (install all three targets into a temp home, then doctor them)
      # so the primary `install-uscha.py` flow is measured on a real macOS/Linux/Windows box,
      # not just approximated. Closes the "no real end-user install on macOS" gap for the
      # installer path (the plugin-marketplace and pi-runtime paths remain out of CI reach).
      - name: Real installer end-to-end (install --target all + doctor)
        shell: bash
        run: |
          set -e
          # A RELATIVE home (under the workspace) resolves identically in git-bash and in
          # Windows Python -- an MSYS /tmp path does not (Windows Python reads it drive-relative).
          # Pipe doctor's JSON straight into python: no intermediate file to mis-resolve.
          python uscha-kit/install-uscha.py install --target all --home ci-install-home > /dev/null
          python uscha-kit/install-uscha.py doctor  --target all --home ci-install-home --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True, d; \
                [print(t, s['golden_guard'], s['healthy']) for t, s in d['targets'].items()]"
          rm -rf ci-install-home

      # AC-03 (the private-name scan) IS measured in CI since 1.55.x: the list ships as
      # SHA-256 hashes (.uscha-private-names.sha256), so the criterion runs anywhere without
      # publishing the names it exists to keep out. It used to emit <skipped/> here, which hid
      # a real miss for weeks. The untracked plaintext list remains the release machine's
      # stricter superset (it can carry prefixes/regexes, which a hash cannot express).
      - name: Show the self-application acceptance emission
        if: always()
        shell: bash
        run: |
          test -f reports/junit/uscha-acceptance.xml \
            && cat reports/junit/uscha-acceptance.xml \
            || echo "no acceptance report emitted"
