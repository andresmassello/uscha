name: smoke

# Cross-platform validation. The audit that motivated this (docs/CROSS-PLATFORM.md) was
# STATIC -- nobody had run the suite on a real Linux or macOS box. Per the kit's own
# doctrine, "cross-platform" is a claim until it is MEASURED on all three OSes. This is
# that measurement. A red cell here is a real finding, not a flake.

# Was MANUAL-ONLY for a day (2026-07-25): the account ran out of Actions minutes and every push
# produced a run that died in 6s with "recent account payments have failed" -- six red cells that
# measured NOTHING, which is worse than no signal because a red grid reads like a real failure.
# The repo is PUBLIC as of 2026-07-26, so standard runners are free again and the matrix is back
# on every push. macOS stops being UNMEASURED the moment this grid goes green (docs/CROSS-PLATFORM.md).

# THREE cells on a branch push or PR, SIX on a tag or a manual dispatch (1.97.0). Six cells of a
# ~35-minute suite on every push is a lot of measurement to buy the same answer twice: the grid
# exists for the two failures that are INVISIBLE outside it -- bash 3.2 quoting on macOS and 8.3
# short paths under `runneradmin` on Windows -- plus the 3.8-vs-3.9+ interpreter split. The
# reduced grid keeps one cell for each: ubuntu/3.13 (the reference cell), macos/3.13 (the bash
# 3.2 trap: macOS ships that bash whatever Python is installed) and windows/3.8 (the path trap
# AND the floor interpreter, and the slowest cell, so wall time barely moves).
# What the reduced grid does NOT measure is stated rather than implied: ubuntu/3.8, macos/3.8 and
# windows/3.13. A tag runs all six before anything is published -- `publish.yml` gates on the
# TAG's run, not on the branch push's.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo. It also runs on pull_request,
# i.e. on arbitrary code from forks -- it must therefore NEVER see a publishing secret.
# Actions are pinned to full commit SHAs, not moving tags: a tag can be repointed at new
# code by whoever controls the action, and this workflow runs on every push. The trailing
# comment records which version each SHA was, so an upgrade stays reviewable.

permissions:
  contents: read

jobs:
  # Which grid to run. GitHub does not expose the `matrix` context to a job-level `if:`, so a
  # per-cell condition is not expressible -- the matrix itself is computed here and consumed with
  # `fromJSON`. That is also the better shape: a reduced run has THREE jobs, not six with three
  # skipped, so the checks list says what was measured instead of needing to be read carefully.
  grid:
    name: choose the grid
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -e
          SIX='{"include":[{"os":"ubuntu-latest","python":"3.8"},{"os":"ubuntu-latest","python":"3.13"},{"os":"macos-latest","python":"3.8"},{"os":"macos-latest","python":"3.13"},{"os":"windows-latest","python":"3.8"},{"os":"windows-latest","python":"3.13"}]}'
          THREE='{"include":[{"os":"ubuntu-latest","python":"3.13"},{"os":"macos-latest","python":"3.13"},{"os":"windows-latest","python":"3.8"}]}'
          if [ "$FULL" = "true" ]; then
            echo "full grid: 6 cells (tag or manual dispatch)"
            echo "matrix=$SIX" >> "$GITHUB_OUTPUT"
          else
            echo "reduced grid: 3 cells (branch push or PR) -- ubuntu/3.13, macos/3.13, windows/3.8"
            echo "matrix=$THREE" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: grid
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false   # one OS red must not hide the others -- we want the whole grid
      matrix: ${{ fromJSON(needs.grid.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35   # the bench grew to 12 archetypes + r2 + roundtrip; Windows py3.8 crossed 20 (measured 2026-08-16)
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. AC-DF-01 (dogfooding) asks whether the
      # root ledger was re-recorded in or after the last engine change -- on the default
      # depth-1 checkout `git log -1 -- <file>` returns HEAD for every path, so the two
      # commits always match and the criterion would pass without measuring. With full
      # history it measures; without it, the suite reports UNMEASURED rather than green.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      # Node is only needed by the npm-router tests (T74/T75); they degrade to a skip
      # if a compiler/shim is unavailable, so this is belt-and-suspenders, not required.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      # coverage.py is a CAPTURE-time dependency of golden-coverage (ADR-006), never a
      # runtime one -- the engine stays stdlib-only and the suite runs fine without it
      # (AC-GM-08 then reports UNMEASURED rather than passing). CI is where we measure, so
      # CI installs it: leaving the one criterion that proves the mapping is real permanently
      # skipped would be exactly the silent-absence the method refuses.
      - name: Install coverage.py (so AC-GM-08 is measured, not skipped)
        shell: bash
        run: python -m pip install --quiet coverage

      - name: Report the interpreter the suite will use
        shell: bash
        run: |
          python --version
          python3 --version || echo "no python3 on PATH (Windows) -- the suite probes for it"

      # shell: bash forces Git-Bash on Windows and the native shell on Linux/macOS, so the
      # ONE suite runs on all three. The engine is Python; only the harness is bash.
      - name: Run the smoke suite
        shell: bash
        run: bash uscha-kit/tests/smoke-engine.sh

      # The smoke exercises the installer with synthetic fixtures; this runs the REAL
      # installer end-to-end (install all three targets into a temp home, then doctor them)
      # so the primary `install-uscha.py` flow is measured on a real macOS/Linux/Windows box,
      # not just approximated. Closes the "no real end-user install on macOS" gap for the
      # installer path (the plugin-marketplace and pi-runtime paths remain out of CI reach).
      - name: Real installer end-to-end (install --target all + doctor)
        shell: bash
        run: |
          set -e
          # A RELATIVE home (under the workspace) resolves identically in git-bash and in
          # Windows Python -- an MSYS /tmp path does not (Windows Python reads it drive-relative).
          # Pipe doctor's JSON straight into python: no intermediate file to mis-resolve.
          python uscha-kit/install-uscha.py install --target all --home ci-install-home > /dev/null
          python uscha-kit/install-uscha.py doctor  --target all --home ci-install-home --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True, d; \
                [print(t, s['golden_guard'], s['healthy']) for t, s in d['targets'].items()]"
          rm -rf ci-install-home

      # AC-03 (the private-name scan) IS measured in CI since 1.55.x: the list ships as
      # SHA-256 hashes (.uscha-private-names.sha256), so the criterion runs anywhere without
      # publishing the names it exists to keep out. It used to emit <skipped/> here, which hid
      # a real miss for weeks. The untracked plaintext list remains the release machine's
      # stricter superset (it can carry prefixes/regexes, which a hash cannot express).
      - name: Show the self-application acceptance emission
        if: always()
        shell: bash
        run: |
          test -f reports/junit/uscha-acceptance.xml \
            && cat reports/junit/uscha-acceptance.xml \
            || echo "no acceptance report emitted"
